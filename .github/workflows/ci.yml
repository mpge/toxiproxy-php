name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep the suite off Toxiproxy's default port so a self-hosted runner with
  # its own server is neither disturbed nor mistaken for one of ours.
  TOXIPROXY_PORT: 18474
  TOXIPROXY_LOG_LEVEL: warn

jobs:
  static-analysis:
    name: Static analysis and coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, json
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: Validate composer.json
        run: composer validate --strict

      - name: Coding standards
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
        env:
          PHP_CS_FIXER_IGNORE_ENV: 1

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  unit:
    name: Unit / PHP ${{ matrix.php }} ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          # The oldest supported PHP also checks the oldest allowed dependency
          # set, which is where a too-loose constraint in composer.json shows up.
          - php: '8.2'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Unit tests
        run: vendor/bin/phpunit --testsuite=unit

  integration:
    name: Integration / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      # One download per Toxiproxy release, shared by every job in the matrix,
      # rather than a fresh 7MB pull on each of them.
      - name: Restore the cached Toxiproxy binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/toxiproxy-php
          key: toxiproxy-${{ runner.os }}-${{ hashFiles('src/Server/Release.php') }}

      - name: Install the Toxiproxy server
        run: php bin/toxiproxy-php install

      - name: Doctor
        run: php bin/toxiproxy-php doctor

      - name: Integration tests
        run: vendor/bin/phpunit --testsuite=integration

  # macOS and Windows are covered for binary discovery, download and process
  # management specifically. Those are the parts that are genuinely
  # platform-dependent; the toxics themselves are the same Go server everywhere.
  cross-platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        # Windows would otherwise default to pwsh. Git Bash is on the runner,
        # and using it keeps every command in this job identical to the Linux
        # ones, so a failure here is a real platform difference rather than a
        # shell quoting difference.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, json
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: Restore the cached Toxiproxy binary
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/toxiproxy-php
            ~/AppData/Local/toxiproxy-php
          key: toxiproxy-${{ runner.os }}-${{ hashFiles('src/Server/Release.php') }}

      - name: Unit tests
        run: vendor/bin/phpunit --testsuite=unit

      - name: Install the Toxiproxy server
        run: php bin/toxiproxy-php install

      - name: Doctor
        run: php bin/toxiproxy-php doctor

      - name: Integration tests
        run: vendor/bin/phpunit --testsuite=integration

  # Proves the package installs and works as a dependency, not just in place:
  # vendor/bin/toxiproxy-php has to resolve an autoloader one directory layout
  # up, and the cache must not land inside vendor/.
  consumer:
    name: Install as a dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: package

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, json
          coverage: none
          tools: composer:v2

      - name: Create a consuming project
        run: |
          mkdir -p consumer
          cd consumer
          cat > composer.json <<'JSON'
          {
              "repositories": [{"type": "path", "url": "../package", "options": {"symlink": false}}],
              "require-dev": {"mpge/toxiproxy-php": "*"},
              "minimum-stability": "dev",
              "prefer-stable": true
          }
          JSON
          composer install --no-interaction --no-progress

      - name: The binary runs from vendor/bin
        working-directory: consumer
        run: |
          vendor/bin/toxiproxy-php version
          vendor/bin/toxiproxy-php install
          vendor/bin/toxiproxy-php doctor

      - name: The binary cache stays out of vendor
        working-directory: consumer
        run: |
          if find vendor -name 'toxiproxy-server*' -type f | grep -q .; then
            echo "A server binary was cached inside vendor/, which this package must never do."
            exit 1
          fi

      - name: Start, use and stop a server
        working-directory: consumer
        run: |
          vendor/bin/toxiproxy-php start --port 18474
          vendor/bin/toxiproxy-php status --port 18474
          php -r '
            require "vendor/autoload.php";
            $t = Mpge\Toxiproxy\Toxiproxy::connect("http://127.0.0.1:18474");
            $p = $t->proxy("redis", "127.0.0.1:6379");
            if ($p->port() <= 0) { fwrite(STDERR, "no automatic port\n"); exit(1); }
            $p->latency(100);
            if (! $p->refresh()->toxics()->has("latency_downstream")) { fwrite(STDERR, "toxic missing\n"); exit(1); }
            echo "proxy on ", $p->listen(), " with ", count($p->toxics()), " toxic(s)\n";
          '
          vendor/bin/toxiproxy-php proxies --port 18474
          vendor/bin/toxiproxy-php stop --port 18474
